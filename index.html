<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  color-scheme: dark;
  --gold-dark: #8a6d1f;
  --gold: #ffd700;
  --bg: #060503;
  --text: #f5e7c4;
  --muted: #a6924f;
  --accent: #ffd700;
  --card-bg: #0e0c06;
  --border: rgba(255,215,0,0.25);
  --hero-pad-x: clamp(16px, 5vw, 60px);
  --fs-hero: clamp(60px, 20vw, 220px);
  --fs-tld: clamp(32px, 10vw, 115px);
  --fs-stat: clamp(28px, 6vw, 48px);
  --fs-label: clamp(12px, 1.5vw, 15px);
  --fs-body: clamp(14px, 1.5vw, 16px);
  --fs-btn: clamp(14px, 1.8vw, 16px);
  --gap-sm: clamp(10px, 2.5vw, 16px);
  --gap-md: clamp(16px, 3.5vw, 24px);
  --gap-lg: clamp(32px, 6vw, 56px);
  --pad-stat: clamp(16px, 4vw, 44px) clamp(16px, 3vw, 28px);
  --r-card: clamp(12px, 2vw, 20px);
}

html { scroll-behavior: smooth; }
body {
  opacity: 0;
  background: var(--bg);
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
  overflow-x: hidden;
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  transition: opacity .2s ease;
}
body.loaded { opacity: 1; }

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
  opacity: .45;
}

.hero {
  max-width: 1200px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: clamp(30px, 8vw, 80px) var(--hero-pad-x);
  gap: 0;
}
.hero::after {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: min(900px, 130vw);
  height: 60%;
  background: radial-gradient(ellipse at 50% 30%, rgba(255,215,0,.20) 0%, rgba(138,109,31,.12) 50%, transparent 75%);
  pointer-events: none;
  z-index: -1;
}

h1 {
  display: inline-flex;
  flex-direction: column;
  align-items: flex-start;
  text-align: left;
  font-family: 'Times New Roman', Times, serif;
  font-weight: 700;
  font-size: var(--fs-hero);
  line-height: .9;
  background: linear-gradient(270deg, #8a6d1f, #ffd700, #fff3c4, #8a6d1f);
  background-size: 400% 400%;
  animation: gradientMove 8s ease infinite;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: clamp(1px, .6vw, 6px);
  user-select: none;
}
@keyframes gradientMove {
  0% { background-position: 0% 50% }
  50% { background-position: 100% 50% }
  100% { background-position: 0% 50% }
}
.tld {
  display: block;
  margin: 0;
  padding: 0;
  width: fit-content;
  text-align: left;
  font-size: var(--fs-tld);
  line-height: 1;
  letter-spacing: calc(var(--fs-tld) * 0.08);
  -webkit-text-fill-color: inherit;
}

.for-sale-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: clamp(20px, 4vw, 32px);
  width: 100%;
}
.for-sale {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  max-width: 100%;
  padding: clamp(6px, 1.5vw, 9px) clamp(16px, 3vw, 24px);
  border-radius: 50px;
  border: 1px solid rgba(255,215,0,.35);
  background: rgba(255,215,0,.08);
  font-size: var(--fs-label);
  font-weight: 600;
  letter-spacing: clamp(0.5px, 0.4vw, 2px);
  text-transform: uppercase;
  color: var(--accent);
  white-space: nowrap;
}
.for-sale .dot {
  flex-shrink: 0;
  width: clamp(6px, 1vw, 8px);
  height: clamp(6px, 1vw, 8px);
  border-radius: 50%;
  background: #ffd700;
  box-shadow: 0 0 8px #ffd700;
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .35; transform: scale(.65); }
}

.stats { margin-top: clamp(32px, 6vw, 54px); width: 100%; }
.stats-inner {
  display: flex;
  justify-content: center;
  gap: var(--gap-sm);
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
}
.stats-inner .stat { width: 100%; }
.stat {
  background: linear-gradient(145deg, rgba(255,215,0,.14), rgba(138,109,31,.10)), var(--card-bg);
  padding: var(--pad-stat);
  border-radius: var(--r-card);
  border: 1px solid var(--border);
  box-shadow: 0 10px 40px rgba(255,215,0,.18);
  position: relative;
  overflow: hidden;
  transition: transform .35s cubic-bezier(.34,1.4,.64,1), box-shadow .35s ease, border-color .35s ease;
  cursor: default;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
.stat::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,215,0,.35), rgba(138,109,31,.35));
  opacity: 0;
  transition: opacity .35s;
  filter: blur(28px);
}
@media (hover: hover) and (pointer: fine) {
  .stat:hover::before { opacity: 1; }
  .stat:hover { transform: translateY(-7px) scale(1.025); box-shadow: 0 22px 60px rgba(255,215,0,.45); border-color: rgba(255,215,0,.5); }
}
.stat-label {
  font-size: clamp(14px, 2.6vw, 28px);
  font-weight: 800;
  color: var(--text);
  position: relative;
  z-index: 1;
  margin-top: clamp(4px, 1vw, 8px);
  line-height: 1.3;
  text-align: center;
  white-space: nowrap;
}

.cta {
  margin-top: clamp(32px, 6vw, 52px);
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  width: 100%;
}
button, a.primary {
  padding: clamp(12px, 2vw, 16px) clamp(24px, 4vw, 36px);
  min-height: 48px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: var(--fs-btn);
  font-weight: 600;
  text-decoration: none;
  transition: opacity .2s, transform .2s, box-shadow .2s, background .2s, border-color .2s;
  white-space: nowrap;
  touch-action: manipulation;
}
button:active, a.primary:active { transform: scale(.96) !important; }
button:focus-visible, a.primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.primary {
  background: linear-gradient(135deg, #8a6d1f, #ffd700);
  color: #15120a;
  box-shadow: 0 4px 24px rgba(255,215,0,.35);
}
@media (hover: hover) and (pointer: fine) {
  .primary:hover { opacity: .88; transform: translateY(-2px); box-shadow: 0 8px 32px rgba(255,215,0,.55); }
}
/* WhatsApp - secondary, same size, gold outline */
.primary.whatsapp {
  background: rgba(255,215,0,.06);
  color: #ffd700;
  border: 1px solid rgba(255,215,0,.45);
  box-shadow: none;
}
@media (hover: hover) and (pointer: fine) {
  .primary.whatsapp:hover { background: rgba(255,215,0,.14); border-color: rgba(255,215,0,.7); opacity: 1; }
}
.primary.whatsapp svg { width: 18px; height: 18px; flex-shrink: 0; }

.cta-note {
  width: 100%;
  margin-top: 14px;
  font-size: 13px;
  letter-spacing: .4px;
  color: rgba(245,231,196,.55);
  text-align: center;
}

.footer {
  margin-top: 28px;
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: rgba(245,231,196,.35);
}

@media (max-width: 900px) {
  .stats-inner { max-width: 500px; }
}
@media (max-width: 480px) {
  .hero { padding: 40px 20px; }
  h1 { line-height: 0.95; }
  .for-sale { white-space: normal; text-align: center; line-height: 1.4; padding: 10px 20px; }
  .cta { flex-direction: column; align-items: stretch; }
  .cta .primary { width: 100%; max-width: 420px; margin: 0 auto; }
  .stat-label { white-space: normal; }
}
@media (max-width: 360px) {
  .stats-inner { flex-direction: column; }
}
@media (max-height: 500px) and (orientation: landscape) {
  .hero { min-height: auto; padding-top: 40px; padding-bottom: 40px; }
  .stats { margin-top: 24px; }
  .cta { margin-top: 24px; }
}
@media (min-width: 1400px) {
  .stats-inner { max-width: 1000px; gap: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
